<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StressCare" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>StressCare</title>
    <!-- The cascade layer order has to be the first CSS the browser sees. Code splitting puts App.css in
         its own file that can load before index.css, so the order is stated here, ahead of every link. -->
    <style>@layer tokens, base, legacy, components, pages, utilities;</style>
    <meta name="description" content="StressCare helps OLFU IT students see how full their week is, spread the work out and keep it manageable." />
    <script>
      // Set the theme before the first paint so a dark-mode visitor never sees a white flash.
      try {
        var saved = localStorage.getItem('stresscare-theme');
        var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark-theme');
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
