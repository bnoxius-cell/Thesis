services:
  - type: web
    name: stresscare-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SENDER_EMAIL
        sync: false
      # Free Render services can't reach SMTP ports, so mail goes out through
      # Brevo's HTTPS API when this is set (Brevo > SMTP & API > API Keys).
      - key: BREVO_API_KEY
        sync: false
      # Web Push (phone/PC notifications). Copy the same three values from server/.env.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # AI reviewers (PDF to questions). Without the key the Reviewers page says it isn't set up.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_NAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # File storage (Cloudflare R2). Files stay off unless FILES_ENABLED is exactly "true".
      # The FILE_* caps can only lower the built-in limits. Values are set in the Render dashboard only.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: CF_ANALYTICS_TOKEN
        sync: false
      - key: FILES_ENABLED
        sync: false
      - key: FILES_RESUME_KEY
        sync: false
      - key: FILE_STORAGE_CAP_MB
        sync: false
      - key: FILE_CLASS_A_MONTHLY_CAP
        sync: false
      - key: FILE_CLASS_B_MONTHLY_CAP
        sync: false
      - key: FILE_UPLOAD_MONTHLY_MB
        sync: false
      - key: FILE_LINK_TTL_SECONDS
        sync: false
      - key: FILES_ALERT_EMAIL
        sync: false
      - key: FILES_ADMIN_EMAILS
        sync: false
